{% extends "base.html" %} {% block title %}View Expense{% endblock %} {% block
content %}
<h1 style="color: rgb(6, 108, 30); block-size: auto">📋 VIEW EXPENSE</h1>
<table border="3" style="border-color: rgb(27, 165, 59)">
  <tr style="color: rgb(6, 108, 30)">
    <th>Item</th>
    <th>Amount</th>
    <th>Category</th>
    <th>Date</th>
  </tr>
  {% for e in expenses%}

  <tr style="color: rgb(13, 66, 57)">
    <td>{{e['Item']}}</td>
    <td>{{e['Amount']}}</td>
    <td>{{e['Category']}}</td>
    <td>{{e['Date']}}</td>
  </tr>
  {% endfor%}
</table>
<br />
<a style="color: rgb(60, 150, 103)" href="/main">Back</a>
{% endblock %}
