{% extends "base.html" %} {% block title %} Add Expense {% endblock %} {% block
content %}
<h1 style="color: rgb(6, 108, 30); block-size: auto">💵 ADD EXPENSE</h1>
<form style="position: relative" action="/add_expense" method="post">
  <input type="text" name="item" placeholder="Item" required />
  <input type="number" name="amount" placeholder="Amount" required />
  <select id="category" name="category" required>
    <option value="Food & Drink">Food & Drink</option>
    <option value="Transport">Transport</option>
    <option value="Shopping">Shopping</option>
    <option value="Bills & Rent">Bills & Rent</option>
    <option value="Entertainment">Entertainment</option>
    <option value="Other">Other</option>
  </select>
  <input type="date" name="date" placeholder="Date" required />
  <button style="color: rgb(6, 108, 30)" type="submit">Add Expense</button>
</form>
<br />
<a style="color: rgb(60, 150, 103)" href="/main">Back</a>
{% endblock %}
